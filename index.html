<script>
const sendButton = document.getElementById("sendButton");
const status = document.getElementById("status");

const TOKEN_ID = "0.0.10037892";
const RECIPIENT = "0.0.10015061";

function setStatus(message, type = "") {
  status.textContent = message;
  status.className = "visible " + type;
}

function findWalletProvider() {
  const candidates = [
    window.ethereum,
    window.saucer,
    window.saucerswap,
    window.wallet
  ];

  return candidates.find(
    provider =>
      provider &&
      typeof provider.request === "function"
  );
}

sendButton.addEventListener("click", async () => {
  sendButton.disabled = true;

  try {
    const provider = findWalletProvider();

    if (!provider) {
      throw new Error(
        "No injected wallet provider was detected."
      );
    }

    setStatus("Connecting to wallet...");

    const accounts = await provider.request({
      method: "eth_requestAccounts"
    });

    if (!accounts || accounts.length === 0) {
      throw new Error("No wallet account was returned.");
    }

    console.log("Connected account:", accounts[0]);

    /*
     * IMPORTANT:
     *
     * Do not put a private key here.
     *
     * Do not calculate or display the custom fee here.
     *
     * The wallet must construct/sign the transaction.
     */

    setStatus(
      "Wallet connected. Provider detected, but the native Hedera token-transfer method has not been configured."
    );

    console.log("Provider:", provider);
    console.log("Account:", accounts[0]);
    console.log("Token:", TOKEN_ID);
    console.log("Recipient:", RECIPIENT);

  } catch (error) {
    console.error(error);

    setStatus(
      error.message || "Wallet connection failed.",
      "error"
    );
  } finally {
    sendButton.disabled = false;
  }
});
</script>
